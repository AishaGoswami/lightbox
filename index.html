<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
          font-family: sans-serif;
          margin: 0px;
          padding: 0px;  
        }
        .productSection{
            width: 100%;
            padding: 50px 0px;
        }
        .main{
            width: 1320px;
            margin: auto;
        }
        #productSection h1{
            text-align: center;
            font-size: 30px;
            padding: 20px 0px;
        }
        .main{
            width: 1320px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap: 20px;
        }
        .productItems img{
            height: 250px;
        }
        .modalElement{
            display: none;    
            pointer-events: none;
            position: fixed;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }
        .whiteModal{
            pointer-events: auto;
           width: 800px;
           position: fixed;
           height: 500px;
           left: 50%;
           top: 50%;
           background: white;
           transform: translate(-50%,-50%); 
        }
        .whiteModal img{
            width: 100%;
        }
        .whiteModal span {
            right: 0px;
            font-size: 40px;
            cursor: pointer;
            color: white;
            position: absolute;
        }
    </style>
</head>
<body>
    <div class="modalElement">
        <div class="whiteModal">
            <span>&times;</span>
            <img src="" alt="">
        </div>
    </div>
    <section id="productSection">
        <h1>Products</h1>
    <div class="main">
        <div class="productItems">
            <img src="https://images.pexels.com/photos/1571459/pexels-photo-1571459.jpeg" alt="">
        </div>

         <div class="productItems">
            <img src="https://images.pexels.com/photos/1648768/pexels-photo-1648768.jpeg" alt="">
        </div>

        <div class="productItems">
            <img src="https://images.pexels.com/photos/1669799/pexels-photo-1669799.jpeg" alt="">
        </div>

        <div class="productItems">
            <img src="https://images.pexels.com/photos/3741314/pexels-photo-3741314.jpeg" alt="">
        </div>

        <div class="productItems">
            <img src="https://images.pexels.com/photos/2227832/pexels-photo-2227832.jpeg" alt="">
        </div>

        <div class="productItems">
            <img src="https://images.pexels.com/photos/276583/pexels-photo-276583.jpeg" alt="">
        </div>

         <div class="productItems">
            <img src="https://images.pexels.com/photos/2440471/pexels-photo-2440471.jpeg" alt="">
        </div>

        <div class="productItems">
            <img src="https://images.pexels.com/photos/1571458/pexels-photo-1571458.jpeg" alt="">
        </div>
    </div>
    </section>
    <script>
        let modalElementDiv=document.querySelector(".modalElement")
    //target bta konsi image target hui h. white are a pe click karne per div or image pe tag 
        let mainElement=document.querySelector(".main")
        mainElement.addEventListener("click",(e)=>{
            if(e.target.tagName=="IMG"){
                let clickImagePath=e.target.src
                
                modalElementDiv.style.display="block"
            };
        })
    </script>
</body>
</html>
